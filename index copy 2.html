<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Whiteboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="toolbar">
        <div class="tool-group">
            <label for="colorPicker">Color</label>
            <input type="color" id="colorPicker" value="#000000">
        </div>

        <div class="tool-group">
            <label for="sizePicker">Size</label>
            <input type="range" id="sizePicker" min="1" max="50" value="5">
        </div>

        <div class="separator"></div>

        <button id="undo" class="action-btn" title="Undo Last Action">Undo</button>
        <button id="redo" class="action-btn" title="Redo Action">Redo</button>
        <button id="toggleGrid" class="action-btn">Grid: Off</button>

        <div class="spacer"></div>

        <button id="clear" class="action-btn">Clear</button>
        <button id="download" class="action-btn download">Download PNG</button>
    </div>

    <div class="main-container">
        <div class="side-menu">
            <button class="tool-btn active" data-tool="pencil" title="Pencil Tool">P</button>
            <button class="tool-btn" data-tool="rect" title="Rectangle Tool">R</button>
            <button class="tool-btn" data-tool="circle" title="Circle Tool">C</button>
            <button class="tool-btn" data-tool="line" title="Line Tool">L</button>
            <button class="tool-btn" data-tool="text" title="Text">T</button>
        </div>

        <canvas id="whiteboard"></canvas>
    </div>

    <div id="cursor-ghost"></div>

    <script src="whiteboard.js"></script>
</body>
</html>
